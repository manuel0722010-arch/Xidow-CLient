name: Compilar Xidow Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Permisos de ejecucion para Gradle
        run: chmod +x gradlew || true

      - name: Compilar mod con Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Guardar archivo .jar
        uses: actions/upload-artifact@v4
        with:
          name: Xidow-Client-Mod
          path: build/libs/*.jar
